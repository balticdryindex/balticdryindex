# Sveltia CMS configuration for BalticDryIndex.com
# Login: go to /admin/, click "Sign in with token", paste your GitHub PAT.

backend:
  name: github
  repo: balticdryindex/balticdryindex
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads

backend_commit_messages:
  create: 'News: create "{{slug}}"'
  update: 'News: update "{{slug}}"'
  delete: 'News: delete "{{slug}}"'

collections:
  - name: news
    label: News Posts
    label_singular: News Post
    folder: content/news
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { name: description, label: 'Summary (for search & the news list)', widget: text }
      - { name: author, label: Author, widget: string, default: 'BalticDryIndex.com', required: false }
      - { name: body, label: Body, widget: markdown }
