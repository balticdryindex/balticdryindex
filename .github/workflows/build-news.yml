name: Build News Pages

# When the CMS (or you) commits a Markdown post under content/news/, render it
# into styled HTML under /news/ and commit that. Cloudflare Pages then deploys.

on:
  push:
    branches: [main]
    paths:
      - 'content/news/**'
      - 'scripts/build_news.py'
  workflow_dispatch:

jobs:
  build-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install markdown pyyaml

      - name: Render news
        run: python scripts/build_news.py

      - name: Commit rendered pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add news/
          git commit -m "Render news pages ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          git push
