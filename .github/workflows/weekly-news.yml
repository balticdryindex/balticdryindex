name: Weekly BDI News

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  weekly-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Run updater full
        run: python scripts/update_bdi.py

      - name: Commit weekly news
        run: |
          git config --global user.name "BDI Bot"
          git config --global user.email "bot@balticdryindex.com"

          git add -A
          git diff --staged --quiet || git commit -m "Weekly BDI news update"
          git push
