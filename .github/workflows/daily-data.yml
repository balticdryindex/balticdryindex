name: Daily BDI Update

# Runs every weekday shortly after the Baltic Exchange publishes (~13:00 UTC).
# Fetches the live value, appends it to the growing history, recomputes the
# API artifacts (signals / forecast / brief), re-renders the homepage value +
# title + meta, and commits to main. Cloudflare Pages rebuilds automatically.

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  schedule:
    - cron: "20 13 * * 1-5"  # 13:20 UTC, Mon-Fri

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Run daily updater
        run: python scripts/update_bdi.py --data-only

      - name: Commit updated data + rendered homepage
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/ index.html
          git commit -m "Daily BDI update ($(date -u +%Y-%m-%d))" || echo "No changes to commit"
          git push
