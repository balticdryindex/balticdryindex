name: Daily BDI Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * 1-5"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Run updater
        run: python scripts/update_bdi.py --data-only

      - name: Commit updated latest.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/latest.json
          git commit -m "Update BDI data" || echo "No changes to commit"
          git push
