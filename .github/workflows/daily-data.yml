name: Daily BDI Prices

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  daily-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Run updater (data only)
        run: python scripts/update_bdi.py --data-only

      - name: Publish latest.json to gh-pages
        run: |
          git config --global user.name "BDI Bot"
          git config --global user.email "bot@balticdryindex.com"

          mkdir -p /tmp/out/data
          cp data/latest.json /tmp/out/data/latest.json

          git fetch origin gh-pages || true
          git checkout --orphan gh-pages-temp
          git rm -rf . || true

          mkdir -p data
          cp /tmp/out/data/latest.json data/latest.json

          git add data/latest.json
          git commit -m "Daily price update" || echo nochanges

          git branch -D gh-pages || true
          git branch -m gh-pages
          git push origin gh-pages --force
