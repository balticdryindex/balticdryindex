name: Daily BDI Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1-5"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 lxml

      - name: Run updater
        run: python scripts/update_bdi.py --data-only

      - name: Publish latest.json to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          mkdir temp
          cp data/latest.json temp/latest.json

          git checkout --orphan gh-pages
          git rm -rf . || true

          mkdir -p data
          cp temp/latest.json data/latest.json

          git add data/latest.json
          git commit -m "Update latest.json"
          git push origin gh-pages --force
